version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: meridian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_secret
      POSTGRES_DB: meridian_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: meridian_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://meridian:meridian_secret@db:5432/meridian_db
      SECRET_KEY: meridian_super_secret_jwt_key_2026_british_auction
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: meridian_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

